<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Recomp Tracker</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header><h1><span id="hTitle">Log</span><span class="date"><span id="sync" style="margin-right:8px;font-size:11px"></span><span id="hDate"></span></span></h1></header>
<main id="main"></main>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>
<div id="login" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:100;overflow:auto;">
  <div class="card" style="max-width:360px;margin:12vh auto 0;">
    <h2>Sign in</h2>
    <label class="fl">Email</label><input id="lgE" type="email" autocomplete="username" autocapitalize="none">
    <label class="fl">Password</label><input id="lgP" type="password" autocomplete="current-password">
    <div id="lgErr" style="color:var(--bad);font-size:13px;margin-top:8px;"></div>
    <div style="margin-top:12px"><button class="btn primary" style="width:100%" onclick="doLogin()">Sign in</button></div>
    <div class="muted" style="margin-top:10px">Account is created once in Supabase → Authentication → Users.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
